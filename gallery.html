<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Grand Palace Hotel</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Shared Navbar -->
    <div id="navbar-container"></div>

    <!-- Hero Section -->
    <section class="gallery-banner">
        <h1>Our Gallery</h1>
        <p>Explore the elegance and luxury of Grand Palace Hotel.</p>
    </section>

    <!-- Gallery Grid -->
    <section class="gallery-section">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=900" alt="Hotel Exterior">
            <div class="overlay">Hotel Exterior</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=900" alt="Luxury Room">
            <div class="overlay">Luxury Room</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=900" alt="Swimming Pool">
            <div class="overlay">Infinity Pool</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=900" alt="Restaurant">
            <div class="overlay">Fine Dining</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=900" alt="Suite">
            <div class="overlay">Royal Suite</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1549294413-26f195200c16?w=900" alt="Spa">
            <div class="overlay">Luxury Spa</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1445019980597-93fa8acb246c?w=900" alt="Reception">
            <div class="overlay">Reception</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=900" alt="Bedroom">
            <div class="overlay">Premium Bedroom</div>
        </div>

    </section>

    <!-- Shared Footer -->
    <div id="footer-container"></div>

    <script src="script.js"></script>

</body>
</html>
